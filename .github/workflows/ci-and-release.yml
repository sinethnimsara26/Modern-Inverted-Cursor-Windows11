name: CI & Multi-Arch Release Build

on:
  push:
    branches: [main, "hardening/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            suffix: x64
            runner: windows-latest
            toolchain: stable
            target: x86_64-pc-windows-msvc
            static_crt: false
            expected_machine: "0x8664"
          - arch: arm64
            suffix: arm64
            runner: windows-11-arm
            toolchain: stable
            target: aarch64-pc-windows-msvc
            static_crt: false
            expected_machine: "0xAA64"
          - arch: x64
            suffix: win7-win10-x64
            runner: windows-latest
            toolchain: "1.75.0"
            target: x86_64-pc-windows-msvc
            static_crt: true
            expected_machine: "0x8664"
          - arch: x86
            suffix: win7-win10-x86
            runner: windows-latest
            toolchain: "1.75.0"
            target: i686-pc-windows-msvc
            static_crt: true
            expected_machine: "0x014C"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.toolchain }} / ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          components: ${{ matrix.suffix == 'x64' && 'rustfmt, clippy' || '' }}

      - name: Format & Clippy lint gate (x64)
        if: matrix.suffix == 'x64'
        shell: pwsh
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build release binaries and run unit tests (${{ matrix.suffix }})
        shell: pwsh
        run: |
          $params = @{
            Arch      = "${{ matrix.arch }}"
            Suffix    = "${{ matrix.suffix }}"
            Toolchain = "${{ matrix.toolchain }}"
            Target    = "${{ matrix.target }}"
          }
          if ("${{ matrix.static_crt }}" -eq "true") {
            $params.StaticCrt = $true
          }
          & ./build.ps1 @params

      - name: Verify PE architecture (${{ matrix.expected_machine }}) & GUI subsystem
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem dist -Filter "ModernInvertedCursors-Setup-v*-${{ matrix.suffix }}.exe" | Select-Object -First 1
          $guardExe = Get-ChildItem dist -Filter "ModernInvertedCursors-Guardian-v*-${{ matrix.suffix }}.exe" | Select-Object -First 1
          $exes = @($setupExe, $guardExe)
          foreach ($f in $exes) {
            if ($null -eq $f) { throw "Missing expected EXE for ${{ matrix.suffix }}" }
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = "0x{0:X4}" -f [BitConverter]::ToUInt16($b, $pe + 4)
            $subsys = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
            $osVer = "{0}.{1:D2}" -f [BitConverter]::ToUInt16($b, $pe + 24 + 40), [BitConverter]::ToUInt16($b, $pe + 24 + 42)
            Write-Host "$($f.Name): Machine=$machine Subsystem=$subsys OS=$osVer Size=$($b.Length)"
            if ($machine -ne "${{ matrix.expected_machine }}") { throw "Machine mismatch for $($f.Name): $machine" }
            if ($subsys -ne 2) { throw "Subsystem must be 2 (Windows GUI), got $subsys" }
          }

      - name: Audit Legacy Win7–Win10 static DLL imports (${{ matrix.suffix }})
        if: matrix.static_crt == true
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found on runner" }
          foreach ($pat in @("ModernInvertedCursors-Setup-v*-${{ matrix.suffix }}.exe", "ModernInvertedCursors-Guardian-v*-${{ matrix.suffix }}.exe")) {
            $exe = Get-ChildItem dist -Filter $pat | Select-Object -First 1 -ExpandProperty FullName
            $imps = & $dumpbin /IMPORTS $exe | Select-String "\.dll$" | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
            Write-Host "$exe imports: $($imps -join ', ')"
            $bad = $imps | Where-Object { $_ -match "^(VCRUNTIME|api-ms-win-crt-|api-ms-win-core-synch-l1-2-0)" }
            if ($bad) { throw "Forbidden Win8+/CRT DLL import in legacy binary: $($bad -join ', ')" }
          }

      - name: Verify Dark-Mode Setup UI smoke rendering & CLI negative paths (${{ matrix.suffix }})
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem dist -Filter "ModernInvertedCursors-Setup-v*-${{ matrix.suffix }}.exe" | Select-Object -First 1 -ExpandProperty FullName
          $smoke = "$env:RUNNER_TEMP\smoke_ui_${{ matrix.suffix }}"
          Start-Process -FilePath $setupExe -ArgumentList "--smoke-ui", $smoke, "--dpi", "144" -Wait
          if (!(Test-Path "$smoke\01_setup_dark.bmp")) { throw "Missing setup UI smoke screenshot" }
          if (!(Test-Path "$smoke\02_installing_dark.bmp")) { throw "Missing progress UI smoke screenshot" }
          if (!(Test-Path "$smoke\03_done_dark.bmp")) { throw "Missing done UI smoke screenshot" }
          if (!(Test-Path "$smoke\04_setup_focus_dark.bmp")) { throw "Missing focus UI smoke screenshot" }
          Get-Content "$smoke\smoke-ui-report.txt"
          $pNeg = Start-Process -FilePath $setupExe -ArgumentList "--silent", "--unknown-flag-test" -PassThru -Wait
          if ($pNeg.ExitCode -eq 0) { throw "Expected non-zero exit for unknown --silent flag" }
          Write-Host "Verified --silent invalid flag exit=$($pNeg.ExitCode)"

      - name: Verify Legacy WinHTTP sandbox cursor install (${{ matrix.suffix }})
        if: matrix.static_crt == true
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem dist -Filter "ModernInvertedCursors-Setup-v*-${{ matrix.suffix }}.exe" | Select-Object -First 1 -ExpandProperty FullName
          $sand = "$env:RUNNER_TEMP\sandbox_${{ matrix.suffix }}"
          Start-Process -FilePath $setupExe -ArgumentList "--sandbox", $sand, "--preset", "compact" -Wait
          if (!(Test-Path "$sand\sandbox-report.txt")) { throw "Missing sandbox-report.txt" }
          Get-Content "$sand\sandbox-report.txt"

      - name: Upload ${{ matrix.suffix }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            dist/ModernInvertedCursors-Setup-v*-${{ matrix.suffix }}.exe
            dist/ModernInvertedCursors-Guardian-v*-${{ matrix.suffix }}.exe
          if-no-files-found: error

  publish-release:
    name: Publish Multi-Arch & Legacy GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download x64, ARM64 & Legacy Win7–Win10 artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          TITLE_SUFFIX="Setup & Tray Guardian"
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE_SUFFIX="Setup & Tray Guardian (Release Candidate)"
          fi

          cat <<EOF > release_notes.md
          ## Modern Inverted Cursors — Windows 7–11 (x64, ARM64 & Legacy x64/x86)

          **100% Free and Open Source Software (FOSS • MIT License)** — everyone is welcome to use, tweak, fork, and build their own versions! If you run into any bugs, Windows quirks, or ideas, please open an [Issue](https://github.com/sinethnimsara26/Modern-Inverted-Cursor-Windows11/issues) or Pull Request.

          ### Downloads (\`$TAG\`)
          - **Modern Windows 10 & 11 (x64 Intel/AMD):** \`ModernInvertedCursors-Setup-$TAG-x64.exe\` (standalone guardian: \`ModernInvertedCursors-Guardian-$TAG-x64.exe\`)
          - **Modern Windows 11 (ARM64 Snapdragon):** \`ModernInvertedCursors-Setup-$TAG-arm64.exe\` (standalone guardian: \`ModernInvertedCursors-Guardian-$TAG-arm64.exe\`)
          - **Legacy Windows 7 SP1 / 8 / 8.1 / 10 (x64):** \`ModernInvertedCursors-Setup-$TAG-win7-win10-x64.exe\` (standalone guardian: \`ModernInvertedCursors-Guardian-$TAG-win7-win10-x64.exe\`)
          - **Legacy Windows 7 SP1 / 8 / 8.1 / 10 (32-bit x86):** \`ModernInvertedCursors-Setup-$TAG-win7-win10-x86.exe\` (standalone guardian: \`ModernInvertedCursors-Guardian-$TAG-win7-win10-x86.exe\`)
          - **Checksums:** \`SHA256SUMS.txt\`
          EOF

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GH_REPO"
            gh release edit "$TAG" $PRERELEASE_FLAG --repo "$GH_REPO" --title "$TAG — Windows 7–11 $TITLE_SUFFIX" --notes-file release_notes.md
          else
            gh release create "$TAG" release-assets/* $PRERELEASE_FLAG --repo "$GH_REPO" --title "$TAG — Windows 7–11 $TITLE_SUFFIX" --notes-file release_notes.md
          fi
