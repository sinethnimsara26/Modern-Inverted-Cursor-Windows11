name: Build Modern Inverted Cursor Installer

on:
  push:
    branches: [main]
    paths:
      - "modern-inverted-cursor-installer/**"
      - ".github/workflows/build-modern-inverted-cursor-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build final V5.1 Windows EXE
        shell: pwsh
        run: |
          $src = "modern-inverted-cursor-installer/final/modern_inverted_installer_v5_1_balanced.rs"
          $dist = "modern-inverted-cursor-installer/dist"
          $exe = "$dist/ModernInvertedInstallerV5_1.exe"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          rustc -O $src -o $exe
          if (!(Test-Path $exe)) { throw "EXE was not created" }

          Get-ChildItem $dist -Filter "ModernInvertedInstallerV*.exe" |
            Where-Object Name -ne "ModernInvertedInstallerV5_1.exe" |
            Remove-Item -Force

          $hash = Get-FileHash $exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  ModernInvertedInstallerV5_1.exe" |
            Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload V5.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernInvertedInstallerV5_1-Windows-x64
          path: |
            modern-inverted-cursor-installer/dist/ModernInvertedInstallerV5_1.exe
            modern-inverted-cursor-installer/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit compiled V5.1 product
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A modern-inverted-cursor-installer/dist
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Build ModernInvertedInstallerV5_1.exe [skip ci]"
          git push
